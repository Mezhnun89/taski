name: Make and Docker
on:
  push:
    branches: [main, sprint11-automation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start containers with make all
        run: make all
      - name: Verify HTTP and CRUD through Nginx
        run: python3 scripts/check_taski.py
      - name: Show containers and logs
        if: always()
        run: |
          docker ps -a
          make logs
      - name: Remove lesson containers
        if: always()
        run: make clear
  cache-and-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Measure cold and changed builds and image sizes
        run: python3 scripts/benchmark_build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-measurements
          path: reports/
  native-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: taski-pip-${{ runner.os }}-py310-${{ hashFiles('backend/requirements.txt') }}
      - name: Install dependencies and check Django (timed)
        env:
          CACHE_HIT: ${{ steps.pip-cache.outputs.cache-hit }}
        run: |
          start=$(date +%s%N)
          python -m pip install -r backend/requirements.txt
          python backend/manage.py check
          end=$(date +%s%N)
          echo "pip cache hit: $CACHE_HIT; install + check: $(( (end-start)/1000000 )) ms" | tee -a "$GITHUB_STEP_SUMMARY"
