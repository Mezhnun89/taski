stages: [build]
image: docker:27-cli
services:
  - name: docker:27-dind
variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: '1'
  DOCKER_CERT_PATH: /certs/client
  DOCKER_BUILDKIT: '1'
.docker-build:
  stage: build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker buildx create --use
    - docker buildx build --push --cache-from type=registry,ref="$CI_REGISTRY_IMAGE/taski-$SERVICE:buildcache" --cache-to type=registry,ref="$CI_REGISTRY_IMAGE/taski-$SERVICE:buildcache",mode=max -t "$CI_REGISTRY_IMAGE/taski-$SERVICE:$CI_COMMIT_SHA" "$SERVICE"
docker-frontend-job:
  extends: .docker-build
  variables:
    SERVICE: frontend
docker-backend-job:
  extends: .docker-build
  variables:
    SERVICE: backend
